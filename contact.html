<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ช่องทางติดต่อ | Portfolio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #dff6ff,
                #f8fcff,
                #dce8ff
            );

            margin: 0;

            padding: 30px 15px;

            min-height: 100vh;

            color: #334155;
        }


        /* กล่องหลัก */

        .container {
            max-width: 700px;

            margin: auto;

            background: rgba(255, 255, 255, 0.96);

            padding: 45px 40px;

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(37, 67, 110, 0.15);
        }


        /* หัวข้อเล็ก */

        .small-title {
            font-size: 14px;

            letter-spacing: 4px;

            color: #5d9cbb;

            font-weight: bold;

            margin-bottom: 8px;
        }


        /* หัวข้อ */

        h1 {
            color: #263f55;

            font-size: 35px;

            margin: 10px 0;
        }


        .description {
            color: #7891a5;

            font-size: 16px;

            margin-bottom: 30px;
        }


        /* รายการช่องทางติดต่อ */

        .contact-list {
            display: flex;

            flex-direction: column;

            gap: 15px;

            max-width: 560px;

            margin: auto;
        }


        /* การ์ดติดต่อ */

        .contact-card {
            display: flex;

            align-items: center;

            gap: 18px;

            padding: 18px 20px;

            background: #f8fcff;

            border: 1px solid #d5e6ef;

            border-radius: 20px;

            text-decoration: none;

            color: #365a73;

            text-align: left;

            transition: 0.3s ease;
        }


        /* Hover */

        .contact-card:hover {
            transform: translateY(-5px);

            background: white;

            border-color: #8fc9df;

            box-shadow:
                0 10px 25px rgba(55, 100, 135, 0.15);
        }


        /* ไอคอน */

        .contact-icon {
            width: 55px;

            height: 55px;

            min-width: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e3f4fb;

            border-radius: 16px;

            font-size: 27px;
        }


        /* เนื้อหา */

        .contact-content {
            flex: 1;
        }


        .contact-content h2 {
            margin: 0 0 5px 0;

            font-size: 18px;

            color: #365a73;
        }


        .contact-content p {
            margin: 0;

            font-size: 14px;

            color: #7891a5;
        }


        /* ลูกศร */

        .arrow {
            font-size: 24px;

            color: #9ab7c7;

            transition: 0.3s;
        }


        .contact-card:hover .arrow {
            color: #4f8cab;

            transform: translateX(5px);
        }


        /* ปุ่มกลับ */

        .back {
            display: inline-block;

            margin-top: 30px;

            padding: 12px 25px;

            background: #365a73;

            color: white;

            text-decoration: none;

            border-radius: 50px;

            font-size: 14px;

            transition: 0.3s ease;
        }


        .back:hover {
            background: #5d9cbb;

            transform: translateY(-3px);
        }


        /* Footer */

        footer {
            margin-top: 30px;

            font-size: 13px;

            color: #9aafbf;
        }


        /* มือถือ */

        @media (max-width: 600px) {

            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .contact-card {
                padding: 15px;
            }

            .contact-icon {
                width: 48px;

                height: 48px;

                min-width: 48px;

                font-size: 23px;
            }

            .contact-content h2 {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- หัวข้อ -->

    <p class="small-title">
        MY PORTFOLIO
    </p>


    <h1>
        📱 ช่องทางติดต่อ
    </h1>


    <p class="description">
        สามารถติดต่อและติดตามผลงานของฉันได้ที่ช่องทางต่าง ๆ
    </p>



    <!-- ช่องทางติดต่อ -->

    <div class="contact-list">


        <!-- Facebook -->

        <a
            href="https://www.facebook.com/"
            target="_blank"
            class="contact-card"
        >

            <div class="contact-icon">
                📘
            </div>

            <div class="contact-content">

                <h2>
                    Facebook
                </h2>

                <p>
                    เพิ่ม Facebook ของคุณที่นี่
                </p>

            </div>

            <div class="arrow">
                →
            </div>

        </a>



        <!-- Instagram -->

        <a
            href="https://www.instagram.com/"
            target="_blank"
            class="contact-card"
        >

            <div class="contact-icon">
                📷
            </div>

            <div class="contact-content">

                <h2>
                    Instagram
                </h2>

                <p>
                    เพิ่ม Instagram ของคุณที่นี่
                </p>

            </div>

            <div class="arrow">
                →
            </div>

        </a>



        <!-- Email -->

        <a
            href="mailto:example@gmail.com"
            class="contact-card"
        >

            <div class="contact-icon">
                ✉️
            </div>

            <div class="contact-content">

                <h2>
                    Email
                </h2>

                <p>
                    example@gmail.com
                </p>

            </div>

            <div class="arrow">
                →
            </div>

        </a>



        <!-- โทรศัพท์ -->

        <a
            href="tel:0800000000"
            class="contact-card"
        >

            <div class="contact-icon">
                📞
            </div>

            <div class="contact-content">

                <h2>
                    โทรศัพท์
                </h2>

                <p>
                    080-000-0000
                </p>

            </div>

            <div class="arrow">
                →
            </div>

        </a>


    </div>



    <!-- กลับหน้าแรก -->

    <a
        href="index.html"
        class="back"
    >
        ← กลับหน้าหลัก
    </a>


    <footer>
        © 2026 My Portfolio
    </footer>


</div>


</body>

</html>
